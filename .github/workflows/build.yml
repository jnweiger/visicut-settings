name: Build binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: vcsetman
            asset_base: vcsetman-linux
          - os: windows-latest
            artifact_name: vcsetman.exe
            asset_base: vcsetman-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Get version
        id: version
        run: |
          VERSION=$(python vcsetman.py --version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller vcsetman.py --onefile --path=lib --log-level WARN

      - name: Rename artifact
        run: |
          ext=""
          [ "${{ matrix.os }}" = "windows-latest" ] && ext=".exe"
          mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_base }}-${{ steps.version.outputs.version }}${ext}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_base }}-${{ steps.version.outputs.version }}
          path: dist/${{ matrix.asset_base }}-${{ steps.version.outputs.version }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}

